<div class="container mt-4">
    <div class="row">
        <div class="d-flex justify-content-between">
            <div>
                <p class="h3"> <strong class="text-muted">Todo(s)</strong></p>
            </div>
            <div>
                <button class="btn btn-primary" (click)="addTodo()">Add Todo</button>
                @if(numSelected > 0){
                    <button class="btn btn-primary" (click)="deleteSelectedFields()">Delete Record ({{numSelected}})</button>
                }
            </div>
        </div>
    </div>
    <div class="row mt-4">
        <table mat-table [dataSource]="todoList" matSort 
        class="mat-elevation-z8">
        <!-- (matSortChange)="announceSortChange($event)" -->

    <ng-container matColumnDef="select">
        <mat-header-cell *matHeaderCellDef>
            <mat-checkbox (change)="onMasterToggle()"
              [checked]="selection.hasValue() && isAllSelected()"
              [indeterminate]="selection.hasValue() && !isAllSelected()">
            </mat-checkbox>
        </mat-header-cell>
        <mat-cell *matCellDef="let row">
            <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="onSelection($event,row)"
                        [checked]="selection.isSelected(row)">
            </mat-checkbox>
            
        </mat-cell>
        </ng-container>
    <ng-container matColumnDef="todo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header >
        Todo
        </th>
        <td mat-cell *matCellDef="let element"> {{element.todo}} </td>
    </ng-container>

    <ng-container matColumnDef="priority">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Priority
        </th>
        <td mat-cell *matCellDef="let element"> {{element.priority ? (element.priority) : 'N/A'}} </td>
    </ng-container>

    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Status
        </th>
        <td mat-cell *matCellDef="let element"> {{element.status}} </td>
    </ng-container>

    <ng-container matColumnDef="percentage">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Percentatge (%)
        </th>
        <td mat-cell *matCellDef="let element"> {{element.percentage}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element"> 
            <button mat-icon-button color="basic" (click)="viewTodo(element)">
                <mat-icon>remove_red_eye</mat-icon>
            </button> 
                <button mat-icon-button color="primary" (click)="editTodo(element)">
                    <mat-icon>edit</mat-icon>
                </button> 
         </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    </div>
</div>
