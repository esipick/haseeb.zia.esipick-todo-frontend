<div class="container mt-4 mb-4">
    <div class="row">
        <p class="h3 text-muted"><strong>Add Todo</strong></p>
    </div>
    <div class="row justify-content-center">
        @if(!isLoading){
            <div class="row mt-3">
                <div class="col-12">
                    <div class="col-auto">
                        <label for="todo"><strong>Todo</strong></label>
                        <p class="text-muted">{{todoDetail.todo}}</p>
                    </div>
                </div>
                    
            </div>
            <div class="row mt-3">
                <div class="col-4">
                    <div class="col-auto">
                        <label><strong>Priority</strong></label>
                        <p class="text-muted">{{todoDetail.priority}}</p>
                    </div>
                </div>
                <div class="col-4">
                    <div class="col-auto">
                        <label><strong>Status</strong></label>
                        <p class="text-muted">{{todoDetail.status}}</p>
                    </div>
                </div>
                <div class="col-4">
                    <div class="col-auto">
                        <label><strong>Percentage(%)</strong></label>
                        <p class="text-muted">{{todoDetail.percentage}}</p>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-6">
                    <div class="col-auto">
                        <button class="btn btn-primary" (click)="close()" >Close</button>
                    </div>
                </div>
            </div>
        } @else{
            <ngx-skeleton-loader
            count="5"
            [theme]="{ 'border-radius': '0', height: '20px' }"
        ></ngx-skeleton-loader>
        }
    </div>
</div>
